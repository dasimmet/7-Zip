name: Continuous Integration

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.0.5

      - name: Run `build`
        run: zig build ci -Doptimize=ReleaseFast

      - name: Upload files individually
        run: |
          for file in ./zig-out/*; do
            [ -e "$file" ] || continue # Handle empty matches
            name=$(basename "$file")
            echo "Processing $name..."
            # Call your upload or processing command here
            gh run upload "$GITHUB_RUN_ID" "$file" --name "$name"
          done
