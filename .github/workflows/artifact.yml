name: Continuous Integration

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.0.5

      - name: Run `build`
        run: zig build ci -Doptimize=ReleaseFast

      - uses: actions/upload-artifact@v4
        with:
          name: 7zip.zip
          path: zig-out/*
